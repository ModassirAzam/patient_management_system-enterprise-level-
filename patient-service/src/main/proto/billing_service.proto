// hona to ye chahiye is proto file ko do jgh(grpc service and patient-service) rkhne se acha hota ki ek jgh center pr rkh diya jata or vahise sb access krte but it is time taking for now for sake of simplicity we have copied it at two places as mentioned .
syntax = "proto3";

option  java_multiple_files = true;
option  java_package = "billing";

service BillingService {
  rpc CreateBillingAccount (BillingRequest) returns (BillingResponse);
}

message BillingRequest {
  string patientId = 1;
  string name = 2;
  string email = 3;
}

message BillingResponse {
  string accountId = 1;
  string status = 2;
}